<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文去 AI 味检测器</title>
<style>
  :root{
    --bg:#f7f6f3;
    --card:#ffffff;
    --ink:#1f2328;
    --muted:#6b7280;
    --line:#e5e2db;
    --good:#2f855a;
    --good-bg:#e8f5ec;
    --warn:#b7791f;
    --warn-bg:#fdf3e0;
    --bad:#c53030;
    --bad-bg:#fde8e8;
    --accent:#2c4a6e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header{margin-bottom:22px}
  h1{font-size:24px;font-weight:700;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
  .sub b{color:var(--ink);font-weight:600}

  .grid{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
    gap:20px;
    align-items:start;
  }
  @media(max-width:900px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card h2{
    font-size:13px;font-weight:700;letter-spacing:.8px;
    color:var(--muted);text-transform:uppercase;
    margin-bottom:12px;
  }
  textarea{
    width:100%;
    min-height:420px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    font-size:15px;
    line-height:1.85;
    font-family:inherit;
    color:var(--ink);
    background:#fdfdfc;
    outline:none;
  }
  textarea:focus{border-color:#9db4cc;box-shadow:0 0 0 3px rgba(44,74,110,.08)}

  .toolbar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  button:hover{background:#f3f1ec}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{background:#234058}

  .score-card{display:flex;align-items:center;gap:18px}
  .score-ring{
    width:92px;height:92px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;
    flex-shrink:0;
    background:conic-gradient(var(--ring-color) var(--ring-deg), #eee 0);
    position:relative;
  }
  .score-ring::after{
    content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card);
  }
  .score-ring span{position:relative;z-index:1}
  .score-meta strong{display:block;font-size:16px;margin-bottom:2px}
  .score-meta p{font-size:13px;color:var(--muted)}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .metric{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    background:#fdfcf9;
  }
  .metric .name{font-size:12px;color:var(--muted);margin-bottom:3px}
  .metric .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .metric .val small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
  .badge{
    display:inline-block;margin-top:6px;
    font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600;
  }
  .badge.good{background:var(--good-bg);color:var(--good)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.bad{background:var(--bad-bg);color:var(--bad)}
  .badge.neutral{background:#f0efeb;color:var(--muted)}

  .hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .hit{
    font-size:12px;padding:2px 9px;border-radius:6px;
    background:var(--bad-bg);color:var(--bad);font-weight:600;
  }
  .hit.none{background:var(--good-bg);color:var(--good);font-weight:500}

  .suggestions{margin-top:14px}
  .suggestions li{
    font-size:13px;color:var(--ink);
    margin:0 0 7px 18px;
  }
  .suggestions li b{color:var(--bad)}

  footer{
    margin-top:30px;font-size:12px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:14px;
  }
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>中文去 <span>AI 味</span> 检测器</h1>
    <p class="sub">粘贴文章 → 即时体检。<b>完全离线</b>，不上传、不联网，内容只留在你自己电脑里。</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>你的文章</h2>
      <textarea id="input" placeholder="把论文、开题报告、课程作业粘贴到这里……

建议粘贴全文，至少 500 字，指标才稳定。"></textarea>
      <div class="toolbar">
        <button class="primary" onclick="run()">重新检测</button>
        <button onclick="copyReport()">复制检测结果</button>
        <button onclick="document.getElementById('input').value='';run()">清空</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>AI 味评分</h2>
        <div class="score-card">
          <div class="score-ring" id="ring"><span id="score">--</span></div>
          <div class="score-meta">
            <strong id="verdict">等待输入</strong>
            <p id="verdictSub">粘贴文章后自动分析</p>
          </div>
        </div>
        <div class="metrics" id="metrics">
          <div class="empty">—</div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>禁用词与模板句</h2>
        <div id="hits"><span class="hit none">未检测到禁用词</span></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>修改建议</h2>
        <ul class="suggestions" id="suggestions">
          <li class="empty">粘贴文章后显示</li>
        </ul>
      </div>
    </div>
  </div>

  <footer>
    判断依据：结构信号（理论排比、模板句、段落均匀度）为主，标点信号为辅。
    这是一份启发式体检表，不是任何检测器的官方标准；同一篇文章在不同平台可能给出完全不同的结果。
    <br>本工具不联网、不上传；文章内容不会离开你的设备。
  </footer>
</div>

<script>
(function(){
  var input = document.getElementById('input');

  var BANNED = [
    '首先','其次','再次','最后','此外','因此','综上所述','值得注意的是',
    '总而言之','在当今社会','众所周知','毋庸置疑','接下来',
    '随着社会的发展','随着时代的发展','具有重要意义','发挥着重要作用',
    '不可否认','显而易见','由此可见'
  ];

  // 模板句：允许中间有逗号
  var TEMPLATES = [
    {re:/不是[^。；！？]{1,60}而是/g, name:'不是……而是……'},
    {re:/不仅[^。；！？]{1,60}而且/g, name:'不仅……而且……'},
    {re:/不在于[^。；！？]{1,60}而在于/g, name:'不在于……而在于……'},
    {re:/既[^。；！？]{1,30}又[^。；！？]{1,30}/g, name:'既……又……'},
    {re:/从[^。；！？]{1,20}角度来看/g, name:'从……角度来看'},
    {re:/对于[^。；！？]{1,20}来说/g, name:'对于……来说'},
    {re:/在[^。；！？]{1,20}背景下/g, name:'在……背景下'},
    {re:/起到[^。；！？]{1,20}作用/g, name:'起到……作用'}
  ];

  // 理论名词（误伤正常论文的风险由低权重抵消）
  var THEORY_RE = /(理论|假说|效应|偏差|模型|学说|范式)/g;
  // 理论排比：「XX 理论认为/指出/表明」
  var THEORY_CLAIM_RE = /(理论|假说|效应|偏差|模型|学说)[^。；！？]{0,24}(认为|指出|表明|提出|提醒|告诉|讲|说)/g;
  // 「（1）标签：解释」模具
  var MOLD_RE = /（[0-9一二三四五六七八九十]+）[^：。；\n]{1,14}[：:]/g;
  // 「X认为/指出/表明」排比
  var CLAIM_RE = /(认为|指出|表明|提出|告诉我们|研究发现|研究表明)/g;

  function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
  function fmt(n,d){d=d||0;return Number(n).toFixed(d);}
  function std(arr){
    if(arr.length<2)return 0;
    var m=arr.reduce(function(a,b){return a+b;},0)/arr.length;
    var v=arr.reduce(function(a,b){return a+(b-m)*(b-m);},0)/arr.length;
    return Math.sqrt(v);
  }
  function countRe(text,re){
    var m = text.match(re);
    return m ? m.length : 0;
  }

  function analyze(text){
    var raw = text;
    var hanzi = (raw.match(/[一-龥]/g)||[]).length;
    var base = hanzi>0?hanzi:1;

    var paras = raw.split(/\n+/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
    var paraLens = paras.map(function(p){return (p.match(/[一-龥]/g)||[]).length;}).filter(function(n){return n>0;});

    var sents = raw.split(/[。！？!?]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
    var sentLens = sents.map(function(s){return (s.match(/[一-龥]/g)||[]).length;}).filter(function(n){return n>0;});

    var sentMean = sentLens.length? sentLens.reduce(function(a,b){return a+b;},0)/sentLens.length : 0;
    var sentStd = std(sentLens);
    var sentCV = sentMean>0? sentStd/sentMean : 0;
    var sentMin = sentLens.length? Math.min.apply(null,sentLens) : 0;
    var sentMax = sentLens.length? Math.max.apply(null,sentLens) : 0;

    // 段落长度均匀度：(max-min)/mean，越小越像 AI
    var paraMean = paraLens.length? paraLens.reduce(function(a,b){return a+b;},0)/paraLens.length : 0;
    var paraRange = paraLens.length? Math.max.apply(null,paraLens)-Math.min.apply(null,paraLens) : 0;
    var paraRatio = paraMean>0? paraRange/paraMean : 0;

    // 段落首句长度（构段同构信号）
    var headLens = [];
    paras.forEach(function(p){
      var first = p.split(/[。！？!?]/)[0].trim();
      var n = (first.match(/[一-龥]/g)||[]).length;
      if(n>0) headLens.push(n);
    });
    var headStd = std(headLens);
    var headMean = headLens.length? headLens.reduce(function(a,b){return a+b;},0)/headLens.length : 0;
    var headCV = headMean>0? headStd/headMean : 0;

    var colon = countRe(raw,/[：]/g);
    var semi  = countRe(raw,/[；]/g);
    var quote = countRe(raw,/[“”「」]/g) + countRe(raw,/"/g);
    var period= countRe(raw,/[。]/g);
    var excl  = countRe(raw,/[！!]/g);
    var cjkSp = countRe(raw,/[一-龥]\s+[A-Za-z0-9]/g) + countRe(raw,/[A-Za-z0-9]\s+[一-龥]/g);

    var theories = countRe(raw, THEORY_RE);
    var claims = countRe(raw, CLAIM_RE);
    var theoryClaims = countRe(raw, THEORY_CLAIM_RE);
    var molds = countRe(raw, MOLD_RE);

    var per1k = function(n){return n/base*1000;};
    var per100 = function(n){return n/base*100;};

    var hits = [];
    BANNED.forEach(function(w){
      var c = 0, idx = 0;
      while((idx = raw.indexOf(w, idx)) !== -1){ c++; idx += w.length; }
      if(c>0) hits.push({word:w, count:c, type:'word'});
    });
    TEMPLATES.forEach(function(t){
      var m = raw.match(t.re);
      if(m && m.length) hits.push({word:t.name, count:m.length, type:'template'});
    });
    var hitTotal = hits.reduce(function(a,b){return a+b.count;},0);

    // ===== 子分（0~1，越高越像 AI）=====
    var longEnough = base >= 300;
    var s = {};

    // 结构信号（主）
    s.theory = longEnough ? clamp(per1k(theories)/4, 0, 1) : 0;
    s.theoryClaim = longEnough ? clamp(per1k(theoryClaims)/5, 0, 1) : 0;
    s.template = clamp(per1k(hitTotal)/5, 0, 1);
    s.paraUniform = longEnough ? (paraRatio<0.5 ? 1 : (paraRatio>1.2 ? 0 : (1.2-paraRatio)/0.7)) : 0;
    s.variance = sentCV>=0.5?0 : (sentCV>=0.4?0.2:(sentCV>=0.3?0.55:0.85));
    s.mold = clamp(molds/3, 0, 1);
    s.claim = longEnough ? clamp(per1k(claims)/18, 0, 1) : 0;

    // 标点信号（辅）
    var pd = per100(period);
    s.period = base<200 ? 0 : ((pd<1.5||pd>5.0)?0.6:((pd<1.8||pd>4.2)?0.3:0));
    s.colon = clamp(per1k(colon)/15, 0, 1);
    s.quote = clamp(per1k(quote)/15, 0, 1);
    s.space = cjkSp>8?0.5:(cjkSp>0?0.2:0);
    s.excl = excl>3?0.15:0;

    // 总分
    var weights = {
      theory:1.8, theoryClaim:1.8, template:1.5, paraUniform:1.5,
      variance:1.2, mold:1.5, claim:0.5,
      period:0.6, colon:0.35, quote:0.2, space:0.3, excl:0.1
    };
    var sumW=0, sumS=0;
    Object.keys(weights).forEach(function(k){ sumW+=weights[k]; sumS+=weights[k]*s[k]; });
    var score = Math.round(sumS/sumW*100);

    return {
      hanzi:hanzi, paras:paras.length, sents:sents.length,
      sentMean:sentMean, sentStd:sentStd, sentCV:sentCV, sentMin:sentMin, sentMax:sentMax,
      paraMin: paraLens.length?Math.min.apply(null,paraLens):0,
      paraMax: paraLens.length?Math.max.apply(null,paraLens):0,
      paraRatio:paraRatio, headCV:headCV,
      colon:colon, semi:semi, quote:quote, period:period, excl:excl, cjkSp:cjkSp,
      periodDensity:pd, theories:theories, claims:claims, theoryClaims:theoryClaims, molds:molds,
      per1k:per1k,
      hits:hits, hitTotal:hitTotal,
      score:score, sub:s
    };
  }

  function status(v, warn, bad){
    // 越大越差
    return v>=bad?'bad':(v>=warn?'warn':'good');
  }
  function statusLow(v, warn, bad){
    // 越小越差
    return v<=bad?'bad':(v<=warn?'warn':'good');
  }
  function badge(st){
    if(st==='good') return '<span class="badge good">正常</span>';
    if(st==='warn') return '<span class="badge warn">注意</span>';
    if(st==='bad')  return '<span class="badge bad">警告</span>';
    return '<span class="badge neutral">—</span>';
  }
  function metricHTML(name, val, unit, st){
    return '<div class="metric"><div class="name">'+name+'</div>'+
      '<div class="val">'+val+'<small>'+unit+'</small></div>'+badge(st)+'</div>';
  }

  function reset(){
    document.getElementById('score').textContent='--';
    document.getElementById('score').style.color='';
    document.getElementById('verdict').textContent='等待输入';
    document.getElementById('verdictSub').textContent='粘贴文章后自动分析';
    var ring=document.getElementById('ring');
    ring.style.setProperty('--ring-deg','0deg');
    ring.style.setProperty('--ring-color','#ccc');
    document.getElementById('metrics').innerHTML='<div class="empty">—</div>';
    document.getElementById('hits').innerHTML='<span class="hit none">未检测到禁用词</span>';
    document.getElementById('suggestions').innerHTML='<li class="empty">粘贴文章后显示</li>';
  }

  function run(){
    var text = input.value;
    var out = analyze(text);
    if(out.hanzi < 50){ reset(); return; }

    var deg = out.score*3.6;
    var color = out.score>=65?'#c53030':(out.score>=40?'#b7791f':'#2f855a');
    var ring = document.getElementById('ring');
    ring.style.setProperty('--ring-deg', deg+'deg');
    ring.style.setProperty('--ring-color', color);
    var scoreEl = document.getElementById('score');
    scoreEl.textContent = out.score;
    scoreEl.style.color = color;

    var verdict, sub;
    if(out.score>=65){ verdict='AI 味偏重'; sub='按右侧建议逐项修改'; }
    else if(out.score>=40){ verdict='中等，可优化'; sub='有些指标还可以再打磨'; }
    else { verdict='比较像人写的'; sub='保持这个状态'; }
    document.getElementById('verdict').textContent = verdict;
    document.getElementById('verdictSub').textContent = sub;

    var pk = out.per1k;
    var m = '';
    m += metricHTML('汉字数 / 句数', out.hanzi+' / '+out.sents, '', 'neutral');
    m += metricHTML('段落数', out.paras, '段', 'neutral');
    m += metricHTML('理论词密度', fmt(pk(out.theories),1), '/千字', status(pk(out.theories),4,8));
    m += metricHTML('「理论+认为」排比', fmt(pk(out.theoryClaims),1), '/千字', status(pk(out.theoryClaims),4,7));
    m += metricHTML('模板句命中', out.hitTotal, '处', status(out.hitTotal,3,6));
    m += metricHTML('段落长度差/均值', fmt(out.paraRatio,2), '', statusLow(out.paraRatio,0.8,0.5));
    m += metricHTML('句长变异系数', fmt(out.sentCV,2), '', statusLow(out.sentCV,0.42,0.32));
    m += metricHTML('句长跨度', out.sentMin+'~'+out.sentMax, '字', (out.sentMax-out.sentMin>=35)?'good':'warn');
    m += metricHTML('「（1）标签：」模具', out.molds, '处', status(out.molds,1,3));
    m += metricHTML('句号密度', fmt(out.periodDensity,1), '/百字',
        (out.periodDensity<1.5||out.periodDensity>5.0)?'bad':((out.periodDensity<1.8||out.periodDensity>4.2)?'warn':'good'));
    m += metricHTML('冒号密度', fmt(pk(out.colon),1), '/千字', status(pk(out.colon),6,12));
    m += metricHTML('引号密度', fmt(pk(out.quote),1), '/千字', status(pk(out.quote),5,10));
    m += metricHTML('中英文间空格', out.cjkSp, '处', out.cjkSp>8?'bad':(out.cjkSp>0?'warn':'good'));
    document.getElementById('metrics').innerHTML = m;

    var hitsHTML = out.hits.length===0
      ? '<span class="hit none">未检测到禁用词 / 模板句</span>'
      : out.hits.map(function(h){return '<span class="hit">'+h.word+' ×'+h.count+'</span>';}).join('');
    document.getElementById('hits').innerHTML = hitsHTML;

    var tips = [];
    var pkT = pk(out.theories);
    var pkTC = pk(out.theoryClaims);
    if(pkTC>5) tips.push('<b>「X 理论认为/指出」排比太密</b>（'+fmt(pkTC,1)+'/千字）。这是最典型的 AI 腔之一。每个理论后面补一句"所以我因此改了什么看法"，用不上的删掉。');
    else if(pkT>8) tips.push('<b>理论词密度偏高</b>（'+fmt(pkT,1)+'/千字）。检查一下：每个理论是否真的和你的论点有关？无关的删。');
    else if(pkT>4) tips.push('<b>理论词偏多</b>。不要"X理论认为……Y理论指出……"排排坐。');
    if(out.hitTotal>0) tips.push('<b>命中 '+out.hitTotal+' 处禁用词/模板句</b>。优先删"首先/其次/此外/因此/综上所述"，把"不是……而是……"改成具体承接。');
    if(out.paraRatio<0.8) tips.push('<b>段落长度太均匀</b>（差值/均值 '+fmt(out.paraRatio,2)+'）。让段落从两三句到十句不等——长短不均是人的痕迹。');
    if(out.sentCV<0.42) tips.push('<b>句长太均匀</b>（变异系数 '+fmt(out.sentCV,2)+'）。穿插 5 字以内的短句和 60 字以上的长句。');
    if(out.molds>0) tips.push('<b>有 '+out.molds+' 处「（1）标签：解释」模具</b>。把标签并进句子：「（1）被试：招募 36 人」→「（1）招募 36 人」。');
    if(out.periodDensity<1.5) tips.push('<b>句号太少</b>（'+fmt(out.periodDensity,1)+'/百字）。可能一逗到底，一个完整意思结束就该用句号。');
    if(out.periodDensity>5.0) tips.push('<b>句号太多</b>（'+fmt(out.periodDensity,1)+'/百字）。句子被拆得太碎，读起来像电报。');
    if(pk(out.colon)>12) tips.push('<b>冒号偏多</b>（'+fmt(pk(out.colon),1)+'/千字）。除了「标签：解释」模具，普通冒号也可以用逗号代替。');
    if(pk(out.quote)>10) tips.push('<b>引号偏多</b>（'+fmt(pk(out.quote),1)+'/千字）。概念名、术语、强调词都不需要引号，只留题名和直接引语。');
    if(out.cjkSp>0) tips.push('<b>中英文之间有空格</b>（'+out.cjkSp+' 处）。中文排版里不加。');
    if(out.hanzi<300) tips.push('文章太短，指标不稳定。建议粘贴 500 字以上再测。');
    if(tips.length===0) tips.push('各项指标都在舒适区。最后别忘了：具体细节和真实立场，比这些数值更重要。');

    document.getElementById('suggestions').innerHTML = tips.map(function(t){return '<li>'+t+'</li>';}).join('');
  }

  function copyReport(){
    var out = analyze(input.value);
    if(out.hanzi<50){ alert('先粘贴文章'); return; }
    var lines = [
      '【去AI味检测报告】',
      '汉字 '+out.hanzi+' ｜ 句 '+out.sents+' ｜ 段 '+out.paras,
      'AI味评分：'+out.score+'/100',
      '理论词 '+out.theories+'（'+fmt(out.per1k(out.theories),1)+'/千字）｜模板句 '+out.hitTotal+'｜「标签：」模具 '+out.molds,
      '段落差/均值 '+fmt(out.paraRatio,2)+'｜句长CV '+fmt(out.sentCV,2)+'｜句号密度 '+fmt(out.periodDensity,1)+'/百字',
      '冒号 '+out.colon+'｜引号 '+out.quote+'｜中英空格 '+out.cjkSp
    ];
    var txt = lines.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ alert('已复制到剪贴板'); }, function(){ alert(txt); });
    } else { alert(txt); }
  }

  input.addEventListener('input', run);
  input.addEventListener('paste', function(){ setTimeout(run, 30); });
  window.copyReport = copyReport;
  window.run = run;
  run();
})();
</script>
</body>
</html>
